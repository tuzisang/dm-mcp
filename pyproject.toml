[project]
name = "dm-mcp"
version = "0.2.0"
description = "达梦数据库 MCP 服务器 (Java 守护进程版本)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
# Java JAR files in lib/ directory:
# - dm-jdbc-1.8.jar (达梦 JDBC 驱动)
# - HikariCP-4.0.3.jar (连接池，Java 8 兼容版本)
# - slf4j-api-2.0.12.jar (日志门面)

[dependency-groups]
dev = [
    "hypothesis>=6.148.7",
    "mypy>=1.20.2",
    "pytest>=9.0.2",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["openspec/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
